<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Chord Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111827;
      --surf:    #1f2937;
      --surf2:   #374151;
      --accent:  #6366f1;
      --green:   #10b981;
      --yellow:  #f59e0b;
      --dim:     #6b7280;
      --text:    #f9fafb;
      --border:  #374151;
      --r:       10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-title { font-size: 17px; font-weight: 700; }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* Mode tabs */
    .mode-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mode-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .mode-tab.active { color: var(--text); border-bottom-color: var(--accent); }

    /* Display wrappers (shared fade) */
    .chord-wrap, .scale-wrap {
      width: 100%;
      text-align: center;
      transition: opacity 0.12s ease;
    }
    .chord-wrap.fade, .scale-wrap.fade { opacity: 0; }
    .scale-wrap { display: none; }
    .scale-wrap.visible { display: block; }

    .chord-current {
      font-size: clamp(72px, 18vw, 160px);   /* the maximum; fitChord() shrinks from here */
      font-weight: 600;
      letter-spacing: -1.5px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }
    .chord-current.pair {
      font-size: clamp(38px, 10vw, 84px);
      letter-spacing: -1px;
    }
    .key-badge {
      display: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 12px;
    }
    .key-badge.visible { display: block; }
    .chord-tones {
      font-size: clamp(14px, 3.6vw, 20px);
      color: var(--dim);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }
    .chord-tones.deg {
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      opacity: 0.72;
    }
    .chord-func {
      font-size: clamp(15px, 4vw, 24px);
      font-weight: 700;
      color: var(--accent);
      margin-top: 10px;
      min-height: 26px;
    }

    /* Segmented control */
    .seg {
      display: flex;
      gap: 3px;
      padding: 3px;
      background: var(--surf2);
      border-radius: 9px;
    }
    .seg-btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.on { background: var(--accent); color: #fff; }

    .scale-root {
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
    }
    .scale-name {
      font-size: clamp(22px, 5.5vw, 44px);
      font-weight: 700;
      margin-top: 6px;
      letter-spacing: -0.5px;
    }
    .scale-notes {
      font-size: 14px;
      color: var(--dim);
      margin-top: 14px;
      min-height: 20px;
      letter-spacing: 0.3px;
    }

    /* ── TIMER ── */
    .next-peek {
      margin-top: 20px;
      min-height: 21px;   /* holds its place whether or not it has text */
      font-size: 15px;
      color: var(--dim);
      letter-spacing: 0.2px;
    }
    .timer-section {
      margin-top: 14px;
      width: 100%;
      max-width: 400px;
    }
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      min-height: 26px;   /* an empty number must not shrink the row */
    }
    .timer-label { font-size: 13px; color: var(--dim); }
    .timer-num   {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 52px;
      text-align: right;
    }
    .bar-track {
      height: 6px;
      background: var(--surf2);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      will-change: width;
    }

    /* ── CONTROLS ── */
    .controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: var(--r);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.1s, transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn:disabled:active { transform: none; }

    .btn-primary   { background: var(--accent); color: #fff; font-size: 16px; padding: 14px 36px; }
    .btn-secondary { background: var(--surf2);  color: var(--text); font-size: 15px; padding: 14px 22px; }
    .btn-icon      { background: transparent; color: var(--text); font-size: 22px; padding: 6px 10px; border-radius: 8px; }

    .pool-badge {
      margin-top: 20px;
      font-size: 12px;
      color: var(--dim);
    }
    .pool-badge.warn { color: var(--yellow); }

    /* ── OVERLAY & PANEL ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surf);
      border-radius: 20px 20px 0 0;
      padding: 12px 20px 40px;
      max-height: 90dvh;
      overflow-y: auto;
      z-index: 21;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.32,.72,0,1);
      overscroll-behavior: contain;
    }
    .panel.open { transform: translateY(0); }

    .panel-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .panel-title { font-size: 18px; font-weight: 700; }

    /* ── SETTINGS SECTIONS ── */
    .s-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 8px;
    }
    .s-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--dim);
    }
    .s-actions { display: flex; gap: 6px; }

    /* Chip */
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .level-hint {
      margin-top: 8px;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--dim);
    }
    .chip {
      padding: 7px 15px;
      border-radius: 20px;
      background: var(--surf2);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .chip-sm { padding: 5px 11px; font-size: 12px; }

    /* Custom interval */
    .custom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .custom-row label { font-size: 13px; color: var(--dim); white-space: nowrap; }
    .num-input {
      background: var(--surf2);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 6px 10px;
      width: 72px;
      text-align: center;
    }
    .num-input:focus { outline: none; border-color: var(--accent); }

    /* Notation chips */
    .notation-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0;
    }
    .notation-row .chip-row { margin-left: auto; }

    /* Note grid */
    .note-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .note-btn {
      padding: 12px 2px;
      border-radius: 8px;
      background: var(--surf2);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .note-btn.on {
      border-color: var(--accent);
      background: rgba(99,102,241,0.12);
      color: var(--accent);
    }

    /* Category sections */
    .cat-section {
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .cat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 10px 11px 14px;
      background: var(--surf2);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: border-color 0.15s;
    }
    .cat-header.all-on  { border-left-color: var(--accent); }
    .cat-header.partial { border-left-color: var(--yellow); }
    .cat-hname  { flex: 1; font-size: 14px; font-weight: 700; }
    .cat-count  { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .cat-chevron {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 11px;
      padding: 4px 6px;
      cursor: pointer;
      transition: transform 0.2s;
      line-height: 1;
    }
    .cat-chevron.open { transform: rotate(180deg); }
    .cat-body {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px 12px;
      background: var(--surf);
      border-top: 1px solid var(--border);
    }
    .cat-body.open { display: flex; }
    .type-chip {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-family: inherit;
      background: var(--surf2);
      color: var(--dim);
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .type-chip.on {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(99,102,241,0.10);
    }

    /* Tension chips, one row per degree */
    #keyTensionRows:not(:empty) { margin-top: 10px; }
    #keyTensionRows .ten-row + .ten-row { margin-top: 6px; }
    .ten-row {
      flex: 0 0 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ten-label {
      min-width: 34px;
      padding: 6px 4px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--dim);
      text-align: left;
      cursor: pointer;
    }
    .ten-label.on { color: var(--text); }

    /* Sub-rows inside a category body */
    .sub-row {
      width: 100%;
      margin-bottom: 9px;
    }
    .sub-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 5px;
    }
    .flavor-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .flavor-chip {
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-family: inherit;
      background: var(--surf2);
      color: var(--dim);
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .flavor-chip.on { border-color: var(--green); color: var(--green); }

    /* Key root selection (single-select, green) */
    .note-btn.key-on {
      border-color: var(--green);
      background: rgba(16,185,129,0.12);
      color: var(--green);
    }

    .panel-pool {
      margin-top: 16px;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      background: var(--surf2);
      text-align: center;
      color: var(--dim);
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <div class="header-title" data-i18n="appTitle">Chord Trainer</div>
  <button class="btn btn-icon" id="settingsBtn" aria-label="Settings">⚙</button>
</header>

<!-- ── MODE TABS ── -->
<div class="mode-tabs">
  <button class="mode-tab active" id="tabChords" data-i18n="tabChords">Chords</button>
  <button class="mode-tab"        id="tabScales" data-i18n="tabScales">Scales</button>
</div>

<!-- ── MAIN ── -->
<main class="main">
  <div class="chord-wrap" id="chordWrap">
    <div class="key-badge"    id="keyBadge"></div>
    <div class="chord-current" id="chordCurrent">Ready</div>
    <div class="chord-func"   id="chordFunc"></div>
    <div class="chord-tones"  id="chordNotes"></div>
    <div class="chord-tones deg" id="chordDegrees"></div>
  </div>
  <div class="scale-wrap" id="scaleWrap">
    <div class="scale-root" id="scaleRoot"></div>
    <div class="scale-name" id="scaleName">Ready</div>
    <div class="scale-notes" id="scaleNotes"></div>
  </div>

  <div class="next-peek" id="nextPeek"></div>

  <div class="timer-section">
    <div class="timer-row">
      <span class="timer-label" id="timerLabel">—</span>
      <span class="timer-num"   id="timerNum"></span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="backBtn"  data-i18n="back" disabled>Back</button>
    <button class="btn btn-secondary" id="skipBtn"  data-i18n="skip">Skip</button>
    <button class="btn btn-primary"   id="startBtn" data-i18n="start">Start</button>
  </div>

  <div class="pool-badge" id="poolBadge"></div>
</main>

<!-- ── OVERLAY ── -->
<div class="overlay" id="overlay"></div>

<!-- ── SETTINGS PANEL ── -->
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <div class="panel-title" data-i18n="settings">Settings</div>
    <button class="btn btn-icon" id="closeBtn">✕</button>
  </div>

  <!-- Level presets -->
  <div class="s-row"><span class="s-label" data-i18n="level">Level</span></div>
  <div class="chip-row" id="levelRow"></div>
  <div class="level-hint" data-i18n="levelHint">Sets everything at once. Adjust freely afterwards.</div>

  <!-- Language -->
  <div class="s-row">
    <span class="s-label" data-i18n="language">Language</span>
    <div class="chip-row" id="langRow">
      <button class="chip on" data-lang="en">English</button>
      <button class="chip"    data-lang="ko">한국어</button>
    </div>
  </div>

  <!-- Interval -->
  <div class="s-row"><span class="s-label" data-i18n="interval">Interval</span></div>
  <div class="chip-row" id="intervalRow"></div>
  <div class="custom-row">
    <label for="customSec" data-i18n="custom">Custom:</label>
    <input type="number" id="customSec" class="num-input" min="1" max="300">
    <button class="btn btn-secondary" id="applyCustom" data-i18n="set" style="padding:7px 14px;font-size:13px">Set</button>
  </div>

  <!-- Peek at the item that comes next -->
  <div class="s-row">
    <span class="s-label" data-i18n="showNext">Preview Next</span>
    <button class="chip" id="showNextBtn">Off</button>
  </div>

  <!-- How chords are chosen (chord mode only) -->
  <div id="practiceModeSection">
    <div class="s-row"><span class="s-label" data-i18n="selectBy">Chord Selection</span></div>
    <div class="seg" id="chordModeSeg">
      <button class="seg-btn on" data-m="random" data-i18n="byType">By Chord Type</button>
      <button class="seg-btn"    data-m="key"    data-i18n="byFunction">By Chord Function</button>
    </div>
  </div>

  <!-- Notation (hidden when chords follow a key — the key decides the spelling) -->
  <div id="notationSection">
    <div class="s-row">
      <span class="s-label" data-i18n="notation">Notation</span>
      <div class="chip-row">
        <button class="chip on" id="notSharp" data-i18n="sharps">♯ Sharps</button>
        <button class="chip"    id="notFlat"  data-i18n="flats">♭ Flats</button>
      </div>
    </div>
  </div>

  <!-- Roots -->
  <div id="rootSection">
    <div class="s-row">
      <span class="s-label" data-i18n="rootNotes">Root Notes</span>
      <div class="s-actions">
        <button class="chip chip-sm" id="allRoots" data-i18n="all">All</button>
        <button class="chip chip-sm" id="noRoots"  data-i18n="none">None</button>
      </div>
    </div>
    <div class="note-grid" id="noteGrid"></div>
  </div>

  <!-- Chord Types (chord-type selection only) -->
  <div id="chordTypesSection">
    <div class="s-row"><span class="s-label" data-i18n="chordTypes">Chord Types</span></div>
    <div id="catGrid"></div>
  </div>

  <!-- Key + chord functions (chord-function selection only) -->
  <div id="keyPracticeSection" style="display:none">
    <div class="s-row"><span class="s-label" data-i18n="key">Key</span></div>
    <div class="note-grid" id="keyRootGrid"></div>
    <div class="seg" id="keyQualSeg" style="margin-top:8px">
      <button class="seg-btn on" data-q="major" data-i18n="major">Major</button>
      <button class="seg-btn"    data-q="minor" data-i18n="minor">Minor</button>
    </div>

    <div class="s-row"><span class="s-label" data-i18n="voicing">Voicing</span></div>
    <div class="chip-row" id="voicingRow">
      <button class="chip"    data-v="tri" data-i18n="triads">Triads</button>
      <button class="chip on" data-v="sev" data-i18n="sevenths">7ths</button>
      <button class="chip"    data-v="ten" data-i18n="tensionsAxis">Tensions</button>
      <button class="chip"    data-v="add" data-i18n="addedAxis">Added</button>
    </div>
    <div id="keyTensionRows"></div>

    <div class="s-row"><span class="s-label" data-i18n="chordFunctions">Chord Functions</span></div>
    <div id="keyGroupGrid"></div>

    <div class="s-row">
      <span class="s-label" data-i18n="showFunction">Show Function</span>
      <div class="chip-row" id="funcModeRow">
        <button class="chip"    data-f="off"   data-i18n="off">Off</button>
        <button class="chip"    data-f="basic" data-i18n="funcBasic">Function</button>
        <button class="chip on" data-f="full"  data-i18n="funcFull">Extended</button>
      </div>
    </div>
  </div>

  <!-- What to spell out under the chord (chord mode only) -->
  <div id="chordDisplaySection">
    <div class="s-row">
      <span class="s-label" data-i18n="showNotes">Show Notes</span>
      <button class="chip" id="showChordNotes">Off</button>
    </div>
    <div class="s-row" id="doubleAccRow">
      <span class="s-label" data-i18n="doubleAcc">Double Accidentals</span>
      <button class="chip" id="doubleAccBtn">Off</button>
    </div>
    <div class="s-row">
      <span class="s-label" data-i18n="showDegrees">Show Degrees</span>
      <button class="chip" id="showDegreesBtn">Off</button>
    </div>
  </div>

  <!-- Scale Types (scale mode only) -->
  <div id="scaleTypesSection" style="display:none">
    <div class="s-row"><span class="s-label" data-i18n="scaleTypes">Scale Types</span></div>
    <div id="scaleCatGrid"></div>
    <div class="s-row">
      <span class="s-label" data-i18n="showNotes">Show Notes</span>
      <button class="chip" id="showNotesToggle">Off</button>
    </div>
  </div>

  <div class="panel-pool" id="panelPool"></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════

const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

// Tension variants, grouped by the degree each occupies. `semi` is the
// interval above the root; it also fixes the order inside the parentheses.
const TENSION_DEGREES = [
  { id:'9',  label:'9',  variants:[
      { id:'b9',  sym:'♭9',  semi:1 },
      { id:'n9',  sym:'9',    semi:2 },
      { id:'s9',  sym:'♯9',  semi:3 } ] },
  { id:'11', label:'11', variants:[
      { id:'n11', sym:'11',   semi:5 },
      { id:'s11', sym:'♯11', semi:6 } ] },

// Which tension variants each 7th chord can carry. A variant left out is an
// avoid note: 11 swallows the 3rd of a major or dominant chord, so those take
// ♯11 instead; a dominant's 4th only appears as the suspension of 7sus4.
const TENSION_AVAIL = {
  maj7:    ['n9', 's11', 'n13'],
  min7:    ['n9', 'n11', 'n13'],
  dom7:    ['b9', 'n9', 's9', 's11', 'b13', 'n13'],
  hdim7:   ['n9', 'n11', 'b13'],                     // locrian ♮2
  dim7:    ['n9', 'n11', 'b13'],                     // a whole step above each chord tone
  mMaj7:   ['n9', 'n11', 'n13'],                     // melodic minor
  '7b5':   ['b9', 'n9', 's9', 'b13', 'n13'],         // the ♭5 is the ♯11, so no 11 either
  aug7:    ['n9', 's11'],                            // whole tone: the ♯5 is a chord tone
  augMaj7: ['n9', 's11'],                            // lydian augmented; 13 clashes with ♯5
  '7sus4': ['b9', 'n9', 'b13', 'n13'],               // the 4th is a chord tone here
};

// Two tensions share a degree only when they sit a whole step apart — ♭9 with
// ♯9. A half step (11/♯11, ♭13/13) means one swallows the other.
function degreePicks(variants) {
  const out = [];
  for (let m = 1; m < (1 << variants.length); m++) {
    const pick = variants.filter((_, i) => m & (1 << i));
    const ok = pick.every((a, i) =>
      pick.every((b, j) => i === j || Math.abs(a.semi - b.semi) >= 2));
    if (ok) out.push(pick);
  }
  return out;
}

// Every combination the active chips allow on this chord: each degree is
// skipped or contributes one pick, and the all-empty result is dropped.
function tensionCombos(typeId) {
  const avail = TENSION_AVAIL[typeId];
  if (!avail) return [];
  const slots = TENSION_DEGREES
    .map(d => degreePicks(
      d.variants.filter(v => avail.includes(v.id) && S.activeTensions.has(v.id))))
    .filter(picks => picks.length);

  let combos = [[]];
  for (const picks of slots) {
    combos = combos.flatMap(c => [c, ...picks.map(pk => [...c, ...pk])]);
  }
  return combos.filter(c => c.length)
               .map(c => c.slice().sort((a, b) => a.semi - b.semi));
}

// A dominant carrying all four altered tensions is written alt, as a lead
// sheet would; everything else lists its tensions in parentheses.
const ALT_KEY = 'b9|s9|s11|b13';

function tensionSuffix(typeId, tensions) {
  const key = tensions.map(v => v.id).join('|');
  if (typeId === 'dom7' && key === ALT_KEY) return 'alt';
  return `(${tensions.map(v => v.sym).join(', ')})`;
}

// STATE
// ═══════════════════════════════════════════════

const S = {
  lang:        (navigator.language || 'en').startsWith('ko') ? 'ko' : 'en',
  running:     false,
  interval:    5,
  timeLeft:    5,
  notation:    'sharp',
  mode:        'chord',   // 'chord' | 'scale'
  activeRoots: new Set([...Array(12).keys()]),
  activeTypes: new Set(
    CATEGORIES
      .filter(c => c.id === 'triad' || c.id === 'seventh')
      .flatMap(c => c.types.map(t => t.id))
  ),
  activeTensions: new Set(),   // tensions are opt-in
  activeScales: new Set(
    SCALE_CATEGORIES.find(c => c.id === 'basic').scales.map(s => s.id)
  ),
  showNotes:   false,   // scale mode
  showChordNotes: false,
  showDegrees:    false,
  doubleAcc:      false,   // spell D♭dim7 as D♭ F♭ A♭♭ C♭♭
  pool:        [],
  prev:        null,
  current:     null,
  next:        null,   // drawn ahead so it can be previewed
  showNext:    false,
  tick:        null,

  // ── Key Practice ──
  chordMode:    'random',   // 'random' | 'key'
  keyRoot:      0,
  keyQuality:   'major',    // 'major' | 'minor'
  minorFlavors: new Set(['harmonic']),
  // Per-quality selection: { major: {groupId: Set}, minor: {...} }
  keySel: {
    major: Object.fromEntries(KEY_GROUPS.map(g => [
      g.id,
      new Set(g.id === 'diatonic' ? KEY_TABLES.major.diatonic.map(i => i.id) : [])
    ])),
    minor: Object.fromEntries(KEY_GROUPS.map(g => [
      g.id,
      new Set(g.id === 'diatonic' ? KEY_TABLES.minor.diatonic.map(i => i.id) : [])
    ])),
  },
  // Per group: a non-empty subset of {'tri','sev'}
  voicing:     new Set(['sev']),
  pairMode:     'pair',     // 'pair' | 'separate'
  funcMode:     'full',   // 'off' | 'basic' | 'full'
};

// ═══════════════════════════════════════════════
// CHORD LOGIC
// ═══════════════════════════════════════════════

function noteName(n) {
  return (S.notation === 'flat' ? FLAT : SHARP)[n % 12];
}

function chordLabel(c) {
  const base = noteName(c.root) + c.type.sym;
  return c.tensions && c.tensions.length
    ? base + tensionSuffix(c.type.id, c.tensions)
    : base;
}

// Which pool are we building? 'scale' | 'key' | 'random'
function activeMode() {
  if (S.mode === 'scale') return 'scale';
  return S.chordMode === 'key' ? 'key' : 'random';
}

// Items of a key group, with the minor-flavor filter applied.
//
// The three minor scales overlap, so with more than one enabled the same chord
// can appear several times (iv is identical in natural and harmonic). Collapse
// those, keeping the first in table order (natural → harmonic → melodic).
// Whether two entries collide depends on the active voicing: harmonic i and
// natural i are the same triad but differ as 7ths — i(M7) vs i7.
function itemsFor(groupId) {
  const items = (KEY_TABLES[S.keyQuality][groupId] || [])
    .filter(it => !it.flavor || S.minorFlavors.has(it.flavor));

  if (!items.some(it => it.flavor)) return items;

  const seen = new Set();
  return items.filter(it => {
    const k = [
      it.deg,
      (S.voicing.has('tri') || S.voicing.has('add')) && it.tri ? it.tri[0] : '',
      (S.voicing.has('sev') || S.voicing.has('ten')) && it.sev ? it.sev[0] : '',
    ].join('|');
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

// Chips normally carry a fixed roman numeral. Minor diatonic entries are
// labelled from the active voicing instead, so survivors of the dedup above
// stay tellable apart (i7 vs i(M7), vii°7 vs viiø7).
function itemLabel(it) {
  if (!it.flavor) return it.label;
  if ((S.voicing.has('sev') || S.voicing.has('ten')) && it.sev) return it.sev[1];
  return it.tri ? it.tri[1] : it.label;
}

// Borrowed and substitute chords keep their own accidental regardless of the
// key's notation — ♭III in C major is E♭M7, never D♯M7.
const LETTERS   = ['C','D','E','F','G','A','B'];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const ACCIDENTAL = { '-2':'♭♭', '-1':'♭', '0':'', '1':'♯', '2':'♯♯' };

// A chord tone takes the letter its degree calls for: the ♭3 of C is E♭, never
// D♯. The root's own letter anchors the count and the accidental is whatever
// distance is left over. Returns null when no spelling is available within the
// allowed accidentals, which tells the caller to fall back.
function spellTone(rootName, rootPc, degree, interval, allowDouble) {
  const li  = LETTERS.indexOf(rootName[0]);
  const num = parseInt(degree.replace(/[^0-9]/g, ''), 10);
  if (li < 0 || !num) return null;
  const lt  = (li + (num - 1) % 7) % 7;
  const pc  = (rootPc + interval) % 12;
  const acc = ((pc - LETTER_PC[lt] + 126) % 12) - 6;
  if (!allowDouble && Math.abs(acc) > 1) return null;
  const mark = ACCIDENTAL[String(acc)];
  return mark === undefined ? null : LETTERS[lt] + mark;
}

// The chord's tones in order: the type's own intervals, then any tensions an
// octave above. Strict spelling piles up double flats on chords like D♭dim7
// (D♭ F♭ A♭♭ C♭♭). Unless the reader asks for those, a chord needing one
// drops to plain note names as a whole — mixing the two spellings inside one
// chord reads worse than either.
function chordTones(typeId, rootPc, rootName, tensions) {
  const ty = TYPE_BY_ID[typeId];
  if (!ty || !ty.iv) return [];
  const parts = ty.iv.map((iv, i) => ({ iv, dg: ty.dg[i] }));
  (tensions || []).forEach(v => parts.push({ iv: v.semi + 12, dg: v.sym }));

  const spelled = parts.map(t => spellTone(rootName, rootPc, t.dg, t.iv, S.doubleAcc));
  const strict  = spelled.every(n => n !== null);
  return parts.map((t, i) => ({
    note: strict ? spelled[i] : noteName(rootPc + t.iv),
    deg:  t.dg,
  }));
}

function noteNameAcc(n, acc) {
  if (acc === 'flat')  return FLAT[n % 12];
  if (acc === 'sharp') return SHARP[n % 12];
  return noteName(n);
}

// The added-tone shapes a triad can take: [type id, roman suffix]
const ADDED_FORMS = {
  maj: [['6', '6'], ['add9', 'add9'], ['69', '6/9']],
  min: [['m6', '6'], ['madd9', 'add9'], ['m69', '6/9']],
};

// Every shape one entry can take under the current voicing. Tensions ride on
// the 7th; added tones drop the 7th, so a dominant would stop being one.
function voicingForms(triType, sevType) {
  const forms = [];
  if (S.voicing.has('tri') && triType) forms.push({ typeId: triType, tensions: [], from: 'tri' });
  if (S.voicing.has('sev') && sevType) forms.push({ typeId: sevType, tensions: [], from: 'sev' });
  if (S.voicing.has('ten') && sevType) {
    for (const tens of tensionCombos(sevType)) {
      forms.push({ typeId: sevType, tensions: tens, from: 'ten' });
    }
  }
  if (S.voicing.has('add') && ADDED_FORMS[triType] && sevType !== 'dom7') {
    for (const [tid, suffix] of ADDED_FORMS[triType]) {
      forms.push({ typeId: tid, tensions: [], from: 'add', suffix });
    }
  }
  return forms;
}

// A form's roman numeral. `full` spells the tensions out the way a Berklee
// worksheet does — IM7(9); the plain reading keeps only what the chord does in
// the key, since tensions colour a function without changing it.
function formRoman(form, romanTri, romanSev, full) {
  if (form.from === 'tri') return romanTri;
  if (form.from === 'add') return romanTri + form.suffix;
  if (form.from === 'ten') {
    return full ? romanSev + tensionSuffix(form.typeId, form.tensions) : romanSev;
  }
  return romanSev;
}

function formKey(form) {
  return form.typeId + (form.tensions.length ? '+' + form.tensions.map(v => v.id).join('+') : '');
}

// 'ii7\u2013V7 / V' \u2192 its three pieces
function splitPairRoman(roman) {
  const [both, target] = roman.split(' / ');
  const [r1, r2] = both.split('\u2013');
  return { r1, r2, target };
}

// The same chord can serve two functions in one key — Am7 is both vi7 and the
// ii7 of V. Those are one chord to play, not two, so the pool holds it once and
// collects the readings; the draw picks which one to show. Entries that agree
// on both chord and reading (the V of a related II–V is its secondary dominant)
// collapse to nothing extra.
function buildKeyPool() {
  const byChord = new Map();

  function add(id, entry, roman, romanBasic) {
    let item = byChord.get(id);
    if (!item) {
      item = Object.assign({ uid: id, romans: [] }, entry);
      byChord.set(id, item);
    }
    if (!item.romans.some(r => r.full === roman)) {
      item.romans.push({ full: roman, basic: romanBasic });
    }
  }

  for (const g of KEY_GROUPS) {
    const sel = S.keySel[S.keyQuality][g.id];

    for (const it of itemsFor(g.id)) {
      if (!sel.has(it.id)) continue;

      if (g.pair) {
        const { r1, r2, target } = splitPairRoman(it.romanSev);
        const triRoman = splitPairRoman(it.romanTri);
        const ra = (S.keyRoot + it.a.deg) % 12;
        const rb = (S.keyRoot + it.b.deg) % 12;

        // Both halves carry their own shape, so the pair is every combination
        const formsA = voicingForms(it.a.tri, it.a.sev);
        const formsB = voicingForms(it.b.tri, it.b.sev);
        for (const fa of formsA) {
          for (const fb of formsB) {
            const idA = `${ra}|${formKey(fa)}`;
            const idB = `${rb}|${formKey(fb)}`;
            const [fa1, fb1] = [formRoman(fa, triRoman.r1, r1, true),
                                formRoman(fb, triRoman.r2, r2, true)];
            const [fa0, fb0] = [formRoman(fa, triRoman.r1, r1, false),
                                formRoman(fb, triRoman.r2, r2, false)];
            if (S.pairMode === 'pair') {
              add(`p|${idA}|${idB}`, {
                kind: 'pair',
                a: { root: ra, typeId: fa.typeId, tensions: fa.tensions },
                b: { root: rb, typeId: fb.typeId, tensions: fb.tensions },
              }, `${fa1}/${target} – ${fb1}/${target}`,
                 `${fa0}/${target} – ${fb0}/${target}`);
            } else {
              add(idA, { kind:'keychord', root: ra, typeId: fa.typeId, tensions: fa.tensions,
                         acc: null }, `${fa1}/${target}`, `${fa0}/${target}`);
              add(idB, { kind:'keychord', root: rb, typeId: fb.typeId, tensions: fb.tensions,
                         acc: null }, `${fb1}/${target}`, `${fb0}/${target}`);
            }
          }
        }
      } else {
        const root = (S.keyRoot + it.deg) % 12;
        for (const f of voicingForms(it.tri && it.tri[0], it.sev && it.sev[0])) {
          add(`${root}|${formKey(f)}`, {
            kind: 'keychord',
            root,
            typeId: f.typeId,
            tensions: f.tensions,
            acc: it.acc || null,
          },
          formRoman(f, it.tri && it.tri[1], it.sev && it.sev[1], true),
          formRoman(f, it.tri && it.tri[1], it.sev && it.sev[1], false));
        }
      }
    }
  }
  return [...byChord.values()];
}

function buildPool() {
  const m = activeMode();
  if (m === 'key') {
    S.pool = buildKeyPool();
  } else if (m === 'scale') {
    S.pool = [];
    for (const root of S.activeRoots) {
      for (const scale of ALL_SCALES) {
        if (S.activeScales.has(scale.id)) {
          S.pool.push({ kind:'scale', root, scale, uid:`s|${root}|${scale.id}` });
        }
      }
    }
  } else {
    S.pool = [];
    for (const root of S.activeRoots) {
      for (const type of ALL_TYPES) {
        if (!S.activeTypes.has(type.id)) continue;
        S.pool.push({ kind:'chord', root, type, tensions:[], uid:`r|${root}|${type.id}` });
        // Tensions stack on whichever 7th chords are switched on
        for (const tens of tensionCombos(type.id)) {
          const key = tens.map(v => v.id).join('+');
          S.pool.push({
            kind:'chord', root, type, tensions:tens,
            uid:`r|${root}|${type.id}|${key}`,
          });
        }
      }
    }
  }
}

function draw(avoidUid) {
  if (!S.pool.length) return null;
  let candidates = S.pool;
  if (avoidUid && S.pool.length > 1) {
    candidates = S.pool.filter(c => c.uid !== avoidUid);
    if (!candidates.length) candidates = S.pool;
  }
  const item = candidates[Math.floor(Math.random() * candidates.length)];
  // A chord with several readings gets one picked as it is drawn, so the
  // preview and the chord itself agree
  if (item && item.romans && item.romans.length > 1) {
    item.romanIdx = Math.floor(Math.random() * item.romans.length);
  }
  return item;
}

// The next item is drawn before it is needed so it can be previewed. A pool
// rebuild can leave a stale one behind, so check it still belongs.
function ensureNext() {
  if (!S.pool.length) { S.next = null; return; }
  if (!S.next || !S.pool.includes(S.next)) {
    S.next = draw(S.current && S.current.uid);
  }
}

function advance() {
  ensureNext();
  S.prev    = S.current;
  S.current = S.next;
  S.next    = draw(S.current && S.current.uid);
  renderItem();
  renderPeek();
  syncBackBtn();
}

// One step only, the way a browser's back button behaves after a single visit:
// the chord just left becomes the next one again.
function goBack() {
  if (!S.prev) return;
  S.next    = S.current;
  S.current = S.prev;
  S.prev    = null;
  S.timeLeft = S.interval;
  renderProgress();
  renderItem();
  renderPeek();
  syncBackBtn();
}

function syncBackBtn() {
  $backBtn.disabled = !S.prev;
}

// How any pool item reads on one line
function peekText(c) {
  if (!c) return '';
  if (c.kind === 'scale')    return noteName(c.root) + ' ' + nm(c.scale);
  if (c.kind === 'pair')     return `${keyChordText(c.a)} – ${keyChordText(c.b)}`;
  if (c.kind === 'keychord') return keyChordText(c);
  return chordLabel(c);
}

function renderPeek() {
  ensureNext();
  $nextPeek.textContent =
    S.showNext && S.current && S.next ? `${t('nextUp')} · ${peekText(S.next)}` : '';
}

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════

// Runs the clock from wherever it stands. Callers that want a full interval
// set it themselves, so resuming keeps the time left at the pause.
function startTimer() {
  stopTimer();
  renderProgress();
  S.tick = setInterval(() => {
    S.timeLeft = Math.max(0, S.timeLeft - 0.1);
    if (S.timeLeft <= 0) {
      S.timeLeft = S.interval;
      advance();
    }
    renderProgress();
  }, 100);
}

function stopTimer() {
  clearInterval(S.tick);
  S.tick = null;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════

const $chordWrap  = document.getElementById('chordWrap');
const $scaleWrap  = document.getElementById('scaleWrap');
const $current    = document.getElementById('chordCurrent');
const $keyBadge   = document.getElementById('keyBadge');
const $chordFunc  = document.getElementById('chordFunc');
const $scaleRoot  = document.getElementById('scaleRoot');
const $scaleName  = document.getElementById('scaleName');
const $scaleNotes = document.getElementById('scaleNotes');
const $barFill    = document.getElementById('barFill');
const $timerLbl   = document.getElementById('timerLabel');
const $timerNum   = document.getElementById('timerNum');
const $poolBadge  = document.getElementById('poolBadge');
const $panelPool  = document.getElementById('panelPool');
const $chordNotes   = document.getElementById('chordNotes');
const $chordDegrees = document.getElementById('chordDegrees');
const $startBtn   = document.getElementById('startBtn');
const $skipBtn    = document.getElementById('skipBtn');
const $backBtn    = document.getElementById('backBtn');
const $nextPeek   = document.getElementById('nextPeek');

// A chord name is one line. With several tensions it outruns a phone screen,
// so start at the CSS maximum and step down until it fits the wrapper.
function fitChord() {
  $current.style.fontSize = '';
  const avail = $chordWrap.clientWidth;
  if (!avail) return;
  let size = parseFloat(getComputedStyle($current).fontSize);
  while (size > 24 && $current.scrollWidth > avail) {
    size -= size > 48 ? 2 : 1;
    $current.style.fontSize = size + 'px';
  }
}

// Which reading of the roman numeral the reader asked for
function romanOf(c) {
  const r = c && c.romans && c.romans[c.romanIdx || 0];
  if (!r) return '';
  return (S.funcMode === 'basic' ? r.basic : r.full) || '';
}

// One key chord as text: note, symbol, and any tensions in parentheses
function keyChordText(x) {
  const base = noteNameAcc(x.root, x.acc || null) + TYPE_SYM[x.typeId];
  return x.tensions && x.tensions.length
    ? base + tensionSuffix(x.typeId, x.tensions)
    : base;
}

function tonesOf(x, acc) {
  return chordTones(x.typeId, x.root, noteNameAcc(x.root, acc || null), x.tensions);
}

// A pair shows both halves, split by the same dash the chord line uses.
function renderTones(c) {
  let groups = [];
  if (c && c.kind === 'chord') {
    groups = [chordTones(c.type.id, c.root, noteName(c.root), c.tensions)];
  } else if (c && c.kind === 'keychord') {
    groups = [tonesOf(c, c.acc)];
  } else if (c && c.kind === 'pair') {
    groups = [tonesOf(c.a), tonesOf(c.b)];
  }
  const line = pick => groups.length && groups.every(g => g.length)
    ? groups.map(g => g.map(pick).join(' \u00b7 ')).join('  \u2013  ')
    : '';
  $chordNotes.textContent   = S.showChordNotes ? line(t => t.note) : '';
  $chordDegrees.textContent = S.showDegrees    ? line(t => t.deg)  : '';
}

function renderItem() {
  if (S.mode === 'chord') {
    $chordWrap.classList.add('fade');
    setTimeout(() => {
      const c = S.current;
      let text = t('ready'), func = '', isPair = false;

      if (c) {
        if (c.kind === 'pair') {
          text = `${keyChordText(c.a)} – ${keyChordText(c.b)}`;
          func = romanOf(c);
          isPair = true;
        } else if (c.kind === 'keychord') {
          text = keyChordText(c);
          func = romanOf(c);
        } else {
          text = chordLabel(c);
        }
      }

      $current.textContent = text;
      $current.classList.toggle('pair', isPair);
      fitChord();
      $chordFunc.textContent = (S.chordMode === 'key' && S.funcMode !== 'off') ? func : '';
      renderTones(c);
      $chordWrap.classList.remove('fade');
    }, 120);
  } else {
    $scaleWrap.classList.add('fade');
    setTimeout(() => {
      if (S.current) {
        $scaleRoot.textContent  = noteName(S.current.root);
        $scaleName.textContent  = nm(S.current.scale);
        $scaleNotes.textContent = S.showNotes
          ? S.current.scale.intervals.map(i => noteName((S.current.root + i) % 12)).join(' · ')
          : '';
      } else {
        $scaleRoot.textContent  = '';
        $scaleName.textContent  = t('ready');
        $scaleNotes.textContent = '';
      }
      $scaleWrap.classList.remove('fade');
    }, 120);
  }
}

function renderProgress() {
  const pct = ((S.interval - S.timeLeft) / S.interval * 100).toFixed(2);
  $barFill.style.width = pct + '%';

  if (S.running) {
    $timerLbl.textContent = S.mode === 'chord' ? t('nextChord') : t('nextScale');
    $timerNum.textContent = S.timeLeft.toFixed(1) + 's';
  } else if (S.current) {
    // Paused still shows what is left, so resuming is predictable
    $timerLbl.textContent = t('paused');
    $timerNum.textContent = S.timeLeft.toFixed(1) + 's';
  } else {
    $timerLbl.textContent = '—';
    $timerNum.textContent = '';
  }
}

function renderPoolCount() {
  const n   = S.pool.length;
  const msg = t('poolMsg')(n, S.mode === 'scale');
  $poolBadge.textContent = msg;
  $poolBadge.className   = 'pool-badge' + (n === 0 ? ' warn' : '');

function refreshPool() {
  buildPool();
  renderPoolCount();
  syncLevelChips();
  renderPeek();
  // Auto-pause if pool empties while running
  if (S.running && !S.pool.length) {
    stopTimer();
    S.running = false;
    $startBtn.textContent = t('start');
    renderProgress();
  }
}

const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

// A level spelled out as concrete values. Both applying and matching read it,
// so the two can never drift apart.
function levelValues(lv) {
  const every12 = [...Array(12).keys()];
  const keySel  = { major: {}, minor: {} };
  // Both qualities get the same groups, so switching major/minor stays on level
  for (const q of ['major', 'minor']) {
    for (const g of KEY_GROUPS) {
      const on = lv.keyGroups === '*' || lv.keyGroups.includes(g.id);
      keySel[q][g.id] = new Set(on ? KEY_TABLES[q][g.id].map(it => it.id) : []);
    }
  }
  return {
    interval: lv.interval,
    roots:    new Set(lv.roots === '*' ? every12 : lv.roots),
    types:    new Set(lv.types === '*' ? ALL_TYPES.map(ty => ty.id) : lv.types),
    tensions: new Set(lv.tensions),
    scales:   new Set(SCALE_CATEGORIES
                .filter(c => lv.scaleCats === '*' || lv.scaleCats.includes(c.id))
                .flatMap(c => c.scales.map(sc => sc.id))),
    voicing:  new Set(lv.voicing),
    funcMode: lv.funcMode,
    notes:    lv.notes,
    degrees:  lv.degrees,
    keySel,
  };
}

function applyLevel(lv) {
  const v = levelValues(lv);
  setInterval_(v.interval);
  S.activeRoots    = v.roots;
  S.activeTypes    = v.types;
  S.activeTensions = v.tensions;
  S.activeScales   = v.scales;
  S.voicing        = v.voicing;
  S.funcMode       = v.funcMode;
  S.showChordNotes = v.notes;
  S.showDegrees    = v.degrees;
  S.keySel         = v.keySel;

  renderNoteGrid();
  syncIntervalChips();
  applyI18n();          // redraws the category lists, key groups, voicing, tensions
  resetDisplay();
}

// A level chip stays lit only while the settings still equal it, so changing
// anything clears it by itself — no "you are in intermediate mode" to go stale.
function levelMatches(lv) {
  const v = levelValues(lv);
  if (S.interval !== v.interval) return false;
  if (S.funcMode !== v.funcMode) return false;
  if (S.showChordNotes !== v.notes || S.showDegrees !== v.degrees) return false;
  if (!sameSet(S.activeRoots, v.roots)) return false;
  if (!sameSet(S.activeTypes, v.types)) return false;
  if (!sameSet(S.activeTensions, v.tensions)) return false;
  if (!sameSet(S.activeScales, v.scales)) return false;
  if (!sameSet(S.voicing, v.voicing)) return false;
  for (const q of ['major', 'minor']) {
    for (const g of KEY_GROUPS) {
      if (!sameSet(S.keySel[q][g.id], v.keySel[q][g.id])) return false;
    }
  }
  return true;
}

function syncLevelChips() {
  document.querySelectorAll('#levelRow .chip').forEach(b => {
    const lv = LEVELS.find(l => l.id === b.dataset.level);
    b.classList.toggle('on', !!lv && levelMatches(lv));
  });
}

// ── Toggle-group renderer (shared by chord types & scale types) ──
function renderToggleGroups(container, cats, opts) {
  const { itemsOf, idOf, labelOf, selOf, openSet, rowsOf } = opts;
  container.innerHTML = '';

  cats.forEach(cat => {
    const items = itemsOf(cat);
    const sel   = selOf(cat);
    const rows  = rowsOf ? rowsOf(cat) : null;

    const section = document.createElement('div');
    section.className = 'cat-section';

    const header  = document.createElement('div');
    header.className = 'cat-header';
    const nameEl  = document.createElement('span');
    nameEl.className = 'cat-hname';
    nameEl.textContent = nm(cat);
    const countEl = document.createElement('span');
    countEl.className = 'cat-count';
    const chevron = document.createElement('button');
    chevron.className = 'cat-chevron';
    chevron.textContent = '\u25bc';
    header.append(nameEl, countEl, chevron);

    const body = document.createElement('div');
    body.className = 'cat-body';

    const chipFor   = new Map();
    const rowLabels = [];

    function makeChip(it) {
      const id   = idOf(it);
      const chip = document.createElement('button');
      chip.className = 'type-chip' + (sel.has(id) ? ' on' : '');
      chip.textContent = labelOf(it);
      chip.addEventListener('click', () => {
        if (sel.has(id)) sel.delete(id); else sel.add(id);
        chip.classList.toggle('on', sel.has(id));
        syncHeader();
        refreshPool();
      });
      chipFor.set(id, chip);
      return chip;
    }

    function setAll(group, on) {
      group.forEach(it => {
        const id = idOf(it);
        if (on) sel.add(id); else sel.delete(id);
        chipFor.get(id).classList.toggle('on', on);
      });
      syncHeader();
      refreshPool();
    }

    if (rows) {
      // Tensions: one row per degree, its label toggling the whole row
      rows.forEach(r => {
        const row = document.createElement('div');
        row.className = 'ten-row';
        const label = document.createElement('button');
        label.className = 'ten-label';
        label.textContent = r.label;
        label.addEventListener('click', () =>
          setAll(r.items, !r.items.every(it => sel.has(idOf(it)))));
        row.appendChild(label);
        r.items.forEach(it => row.appendChild(makeChip(it)));
        rowLabels.push(label);
        body.appendChild(row);
      });
    } else {
      items.forEach(it => body.appendChild(makeChip(it)));
    }

    header.addEventListener('click', e => {
      if (e.target === chevron) return;
      setAll(items, !items.every(it => sel.has(idOf(it))));
    });

    const isOpen = openSet.has(cat.id);
    body.classList.toggle('open', isOpen);
    chevron.classList.toggle('open', isOpen);
    chevron.addEventListener('click', e => {
      e.stopPropagation();
      const now = !openSet.has(cat.id);
      if (now) openSet.add(cat.id); else openSet.delete(cat.id);
      body.classList.toggle('open', now);
      chevron.classList.toggle('open', now);
    });

    function syncHeader() {
      const n = items.filter(it => sel.has(idOf(it))).length;
      countEl.textContent = `${n}/${items.length}`;
      header.className = 'cat-header' + (n === items.length ? ' all-on' : n > 0 ? ' partial' : '');
      if (rows) {
        rows.forEach((r, k) =>
          rowLabels[k].classList.toggle('on', r.items.some(it => sel.has(idOf(it)))));
      }
    }

    syncHeader();
    section.append(header, body);
    container.appendChild(section);
  });
}

      (d.variants.some(v => S.activeTensions.has(v.id)) ? ' on' : '');
    label.textContent = d.label;
    label.addEventListener('click', () => {
      const allOn = d.variants.every(v => S.activeTensions.has(v.id));
      d.variants.forEach(v =>
        allOn ? S.activeTensions.delete(v.id) : S.activeTensions.add(v.id));
      changed();
    });
    row.appendChild(label);

    d.variants.forEach(v => {
      const chip = document.createElement('button');
      chip.className = 'type-chip' + (S.activeTensions.has(v.id) ? ' on' : '');
      chip.textContent = v.sym;
      chip.addEventListener('click', () => {
        if (S.activeTensions.has(v.id)) S.activeTensions.delete(v.id);
        else                            S.activeTensions.add(v.id);
        changed();
      });
      row.appendChild(chip);
    });
    $keyTensionRows.appendChild(row);
  });
}

function syncVoicing() {
  document.querySelectorAll('#voicingRow .chip').forEach(b => {
    b.classList.toggle('on', S.voicing.has(b.dataset.v));
  });
}

// Two independent toggles; the last one enabled can't be turned off
document.querySelectorAll('#voicingRow .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.v;
    if (S.voicing.has(v)) {
      if (S.voicing.size === 1) return;
      S.voicing.delete(v);
    } else {
      S.voicing.add(v);
    }
    syncVoicing();
    renderKeyTensions();
    // Voicing feeds the dedup and the chip labels, so redraw the whole list
    renderKeyGroups();
    refreshPool();
  });
});

function makeSeg(options, current, onPick) {
  const seg = document.createElement('div');
  seg.className = 'seg';
  options.forEach(([val, label]) => {
    const b = document.createElement('button');
    b.className = 'seg-btn' + (val === current ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', () => {
      seg.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('on', x === b));
      onPick(val);
    });
    seg.appendChild(b);
  });
  return seg;
}

function subRow(labelText, node) {
  const wrap = document.createElement('div');
  wrap.className = 'sub-row';
  const lb = document.createElement('span');
  lb.className = 'sub-label';
  lb.textContent = labelText;
  wrap.appendChild(lb);
  wrap.appendChild(node);
  return wrap;
}

function renderKeyGroups() {
  $keyGroupGrid.innerHTML = '';

  KEY_GROUPS.forEach(g => {
    const items = itemsFor(g.id);
    const sel   = S.keySel[S.keyQuality][g.id];

    const section = document.createElement('div');
    section.className = 'cat-section';

    const header  = document.createElement('div');
    header.className = 'cat-header';
    const nameEl  = document.createElement('span');
    nameEl.className = 'cat-hname';
    nameEl.textContent = nm(g);
    const countEl = document.createElement('span');
    countEl.className = 'cat-count';
    const chevron = document.createElement('button');
    chevron.className = 'cat-chevron';
    chevron.textContent = '▼';
    header.append(nameEl, countEl, chevron);

    const body = document.createElement('div');
    body.className = 'cat-body';

    // Minor diatonic: scale-flavor filter
    if (g.id === 'diatonic' && S.keyQuality === 'minor') {
      const row = document.createElement('div');
      row.className = 'flavor-row';
      MINOR_FLAVORS.forEach(f => {
        const c = document.createElement('button');
        c.className = 'flavor-chip' + (S.minorFlavors.has(f.id) ? ' on' : '');
        c.textContent = nm(f);
        c.addEventListener('click', () => {
          if (S.minorFlavors.has(f.id)) {
            if (S.minorFlavors.size === 1) return;   // keep at least one
            S.minorFlavors.delete(f.id);
          } else {
            // A newly revealed scale joins in the group's current on/off state,
            // rather than restoring whatever it happened to hold while hidden.
            const visible = itemsFor(g.id);
            const allOn   = visible.length > 0 && visible.every(it => sel.has(it.id));
            S.minorFlavors.add(f.id);
            KEY_TABLES.minor.diatonic
              .filter(it => it.flavor === f.id)
              .forEach(it => allOn ? sel.add(it.id) : sel.delete(it.id));
          }
          renderKeyGroups();
          refreshPool();
        });
        row.appendChild(c);
      });
      body.appendChild(subRow(t('scaleRow'), row));
    }

    // Related II–V: pair vs separate
    if (g.pair) {
      body.appendChild(subRow(t('display'), makeSeg(
        [['pair', t('asPair')], ['separate', t('separate')]],
        S.pairMode,
        v => { S.pairMode = v; refreshPool(); }
      )));
    }

    const chips = items.map(it => {
      const chip = document.createElement('button');
      chip.className = 'type-chip' + (sel.has(it.id) ? ' on' : '');
      chip.textContent = itemLabel(it);
      chip.addEventListener('click', () => {
        if (sel.has(it.id)) sel.delete(it.id);
        else                sel.add(it.id);
        chip.classList.toggle('on', sel.has(it.id));
        syncHeader();
        refreshPool();
      });
      body.appendChild(chip);
      return chip;
    });

    header.addEventListener('click', e => {
      if (e.target === chevron) return;
      const allOn = items.every(it => sel.has(it.id));
      items.forEach((it, i) => {
        if (allOn) { sel.delete(it.id); chips[i].classList.remove('on'); }
        else       { sel.add(it.id);    chips[i].classList.add('on');    }
      });
      syncHeader();
      refreshPool();
    });

    const isOpen = openGroups.has(g.id);
    body.classList.toggle('open', isOpen);
    chevron.classList.toggle('open', isOpen);
    chevron.addEventListener('click', e => {
      e.stopPropagation();
      const nowOpen = !openGroups.has(g.id);
      if (nowOpen) openGroups.add(g.id); else openGroups.delete(g.id);
      body.classList.toggle('open', nowOpen);
      chevron.classList.toggle('open', nowOpen);
    });

    function syncHeader() {
      const n = items.filter(it => sel.has(it.id)).length;
      countEl.textContent = `${n}/${items.length}`;
      header.className = 'cat-header' + (n === items.length && n > 0 ? ' all-on' : n > 0 ? ' partial' : '');
    }

    syncHeader();
    section.append(header, body);
    $keyGroupGrid.appendChild(section);
  });
}

// ── Show Function toggle ───────────────────────
document.querySelectorAll('#funcModeRow .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    if (S.funcMode === btn.dataset.f) return;
    S.funcMode = btn.dataset.f;
    document.querySelectorAll('#funcModeRow .chip')
      .forEach(b => b.classList.toggle('on', b === btn));
    syncLevelChips();
    if (S.current && S.chordMode === 'key') {
      $chordFunc.textContent = S.funcMode !== 'off' ? romanOf(S.current) : '';
    }
  });
});

// ═══════════════════════════════════════════════
// LANGUAGE
// ═══════════════════════════════════════════════

function applyI18n() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.getElementById('customSec').placeholder = t('secPlaceholder');
  document.querySelectorAll('#langRow .chip')
    .forEach(b => b.classList.toggle('on', b.dataset.lang === S.lang));

  // Toggles whose label depends on their own state
  $showNotesToggle.textContent = S.showNotes      ? t('on') : t('off');
  $showChordNotes.textContent  = S.showChordNotes ? t('on') : t('off');
  $showDegreesBtn.textContent  = S.showDegrees    ? t('on') : t('off');
  $doubleAccBtn.textContent    = S.doubleAcc      ? t('on') : t('off');
  $showNextBtn.textContent     = S.showNext       ? t('on') : t('off');
  $showNextBtn.classList.toggle('on', S.showNext);
  document.querySelectorAll('#funcModeRow .chip')
    .forEach(b => b.classList.toggle('on', b.dataset.f === S.funcMode));
  $startBtn.textContent = S.running ? t('pause') : (S.current ? t('resume') : t('start'));

  syncToneToggles();

  // Content rendered from data tables
  renderLevels();
  renderChordCategories();
  renderScaleCategories();
  renderKeyGroups();
  syncVoicing();
  renderKeyTensions();
  renderKeyBadge();
  renderProgress();
  renderPoolCount();
  renderPeek();
  syncBackBtn();
  if (S.current) renderItem();
  else if (S.mode === 'scale') $scaleName.textContent = t('ready');
  else { $current.textContent = t('ready'); fitChord(); }
}

document.querySelectorAll('#langRow .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    if (S.lang === btn.dataset.lang) return;
    S.lang = btn.dataset.lang;
    applyI18n();
  });
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════

window.addEventListener('resize', fitChord);

renderNoteGrid();
renderKeyRootGrid();
applyVisibility();
refreshPool();
applyI18n();   // renders chord/scale/key groups and all localized text
</script>
</body>
